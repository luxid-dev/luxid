name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  # A generated app must compile, or `luxid new` ships broken.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate and build an API application
        run: |
          cargo run -p luxid-cli --bin luxid -- new demoapp --luxid-path "$PWD" --stack api
          cd demoapp
          cargo run -p luxid-cli --bin luxid --manifest-path ../Cargo.toml -- make:model Post -a
          cargo build

  # The Inertia path has a second half CI would otherwise never compile.
  inertia:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [react, vue, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate, build and bundle a ${{ matrix.client }} application
        run: |
          cargo run -p luxid-cli --bin luxid -- new demoapp \
            --luxid-path "$PWD" --stack inertia --client ${{ matrix.client }}
          cd demoapp
          cargo build
          npm install
          npm run build

      - name: The manifest key must match what the server looks up
        run: |
          cd demoapp
          test -f public/build/.vite/manifest.json
          grep -q "$(grep -oE 'resources/js/app\.[a-z]+' src/routes.rs | head -1)" \
            public/build/.vite/manifest.json
